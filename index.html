<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2D Dota — Туман войны</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1118;--p:rgba(12,18,28,.93);--t:#e8eef6;--m:#8fa3b8;
  --a:#ffd45a;--b:#2a3a4d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);
  font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;touch-action:none;display:block}
#hint{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 6px);
  color:var(--m);background:var(--p);padding:4px 8px;border-radius:6px;
  pointer-events:none;font-size:12px;z-index:10}
#hint b{color:var(--a)}
#mini{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);
  background:var(--p);border:1px solid var(--b);border-radius:8px;
  padding:4px;z-index:10;pointer-events:none}
#mini canvas{display:block;border-radius:4px}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint"><b>WASD / стрелки</b> — движение · враги видны только в тумане</div>
  <div id="mini"><canvas id="mm" width="150" height="100"></canvas></div>

<script>
(() => {
  const cv  = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const mm  = document.getElementById('mm');
  const mctx= mm.getContext('2d');
  let W = 0, H = 0;
  const DPR = Math.min(devicePixelRatio || 1, 2);

  // ----- Мир (больше экрана) -----
  const WORLD = { w: 2400, h: 1600 };

  function resize() {
    W = innerWidth; H = innerHeight;
    cv.width  = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ----- Герой -----
  const hero = { x: WORLD.w/2, y: WORLD.h/2, r: 14, speed: 260 };
  const VIEW_R = 190;                 // радиус обзора (туман)
  const cam = { x: 0, y: 0 };         // камера (левый верхний угол в мире)

  // ----- Враги -----
  const enemies = [];
  const ENEMY_COUNT = 14;
  for (let i = 0; i < ENEMY_COUNT; i++) {
    enemies.push({
      x: 120 + Math.random() * (WORLD.w - 240),
      y: 120 + Math.random() * (WORLD.h - 240),
      r: 12,
      alive: true,
      phase: Math.random() * Math.PI * 2,
    });
  }

  // ----- Управление -----
  const keys = {};
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  // Тач-джойстик (простой): палец задаёт направление
  let touchVec = null;
  cv.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchVec = { x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY };
  }, {passive:true});
  cv.addEventListener('touchmove', e => {
    if (!touchVec) return;
    const t = e.touches[0];
    touchVec.x = t.clientX; touchVec.y = t.clientY;
  }, {passive:true});
  cv.addEventListener('touchend', () => { touchVec = null; }, {passive:true});

  // ----- Утилиты -----
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist2 = (ax, ay, bx, by) => (ax-bx)*(ax-bx) + (ay-by)*(ay-by);

  // ----- Игровой цикл -----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // --- движение героя ---
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft'])  dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup'])    dy -= 1;
    if (keys['s'] || keys['arrowdown'])  dy += 1;

    if (touchVec) {
      const tx = touchVec.x - touchVec.x0;
      const ty = touchVec.y - touchVec.y0;
      const len = Math.hypot(tx, ty);
      if (len > 12) { dx = tx / len; dy = ty / len; }
    }

    const len = Math.hypot(dx, dy);
    if (len > 0) {
      hero.x = clamp(hero.x + (dx/len) * hero.speed * dt, hero.r, WORLD.w - hero.r);
      hero.y = clamp(hero.y + (dy/len) * hero.speed * dt, hero.r, WORLD.h - hero.r);
    }

    // --- камера следует за героем ---
    cam.x = clamp(hero.x - W/2, 0, Math.max(0, WORLD.w - W));
    cam.y = clamp(hero.y - H/2, 0, Math.max(0, WORLD.h - H));

    // --- враги: лёгкое блуждание ---
    for (const e of enemies) {
      if (!e.alive) continue;
      e.phase += dt;
      e.x = clamp(e.x + Math.cos(e.phase * 0.6) * 24 * dt, e.r, WORLD.w - e.r);
      e.y = clamp(e.y + Math.sin(e.phase * 0.9) * 24 * dt, e.r, WORLD.h - e.r);
    }

    draw();
    drawMinimap();
    requestAnimationFrame(loop);
  }

  // ----- Отрисовка -----
  function draw() {
    // фон
    ctx.fillStyle = '#0b1118';
    ctx.fillRect(0, 0, W, H);

    // сетка карты (в экранных координатах, с учётом камеры)
    const gs = 96;
    ctx.strokeStyle = '#16212d';
    ctx.lineWidth = 1;
    const startX = -((cam.x) % gs);
    const startY = -((cam.y) % gs);
    ctx.beginPath();
    for (let x = startX; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = startY; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // границы мира
    ctx.strokeStyle = '#2a3a4d';
    ctx.lineWidth = 3;
    ctx.strokeRect(-cam.x, -cam.y, WORLD.w, WORLD.h);

    // враги (только те, что в радиусе обзора)
    const viewR2 = VIEW_R * VIEW_R;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (dist2(e.x, e.y, hero.x, hero.y) > viewR2) continue; // скрыт туманом
      const sx = e.x - cam.x, sy = e.y - cam.y;
      ctx.beginPath();
      ctx.arc(sx, sy, e.r, 0, Math.PI * 2);
      ctx.fillStyle = '#e2555f';
      ctx.fill();
      ctx.strokeStyle = '#ff9aa1';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // герой
    const hx = hero.x - cam.x, hy = hero.y - cam.y;
    ctx.beginPath();
    ctx.arc(hx, hy, hero.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd45a';
    ctx.fill();
    ctx.strokeStyle = '#fff2b8';
    ctx.lineWidth = 2;
    ctx.stroke();

    // туман войны: затемнение вокруг героя радиальным градиентом
    const g = ctx.createRadialGradient(hx, hy, VIEW_R * 0.55, hx, hy, VIEW_R);
    g.addColorStop(0, 'rgba(5,8,12,0)');
    g.addColorStop(1, 'rgba(5,8,12,0.97)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // ещё сильнее затемняем за пределами радиуса (чтобы враги точно не "просвечивали")
    // (градиент уже почти непрозрачен — этого достаточно)
  }

  // ----- Миникарта -----
  function drawMinimap() {
    const mw = mm.width, mh = mm.height;
    const sx = mw / WORLD.w, sy = mh / WORLD.h;
    mctx.clearRect(0, 0, mw, mh);
    mctx.fillStyle = '#0e1620';
    mctx.fillRect(0, 0, mw, mh);

    // враги
    for (const e of enemies) {
      if (!e.alive) continue;
      const visible = dist2(e.x, e.y, hero.x, hero.y) <= VIEW_R * VIEW_R;
      if (!visible) continue;
      mctx.fillStyle = '#e2555f';
      mctx.beginPath();
      mctx.arc(e.x * sx, e.y * sy, 2.2, 0, Math.PI * 2);
      mctx.fill();
    }

    // герой
    mctx.fillStyle = '#ffd45a';
    mctx.beginPath();
    mctx.arc(hero.x * sx, hero.y * sy, 3, 0, Math.PI * 2);
    mctx.fill();

    // прямоугольник камеры
    mctx.strokeStyle = 'rgba(255,255,255,.35)';
    mctx.lineWidth = 1;
    mctx.strokeRect(cam.x * sx, cam.y * sy, W * sx, H * sy);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
