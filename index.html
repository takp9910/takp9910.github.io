<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ Простые шахматы</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #2b2b3b 0%, #1a1a2a 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-container {
            background: #26263c;
            border-radius: 32px;
            padding: 28px 28px 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.7), inset 0 2px 5px rgba(255, 255, 255, 0.08);
            border: 1px solid #4f4f6b;
        }
        h1 {
            text-align: center;
            margin: 0 0 16px 0;
            font-weight: 400;
            font-size: 28px;
            letter-spacing: 3px;
            color: #ece9e0;
            text-shadow: 0 4px 8px #0a0a12;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        h1 span {
            font-size: 32px;
            filter: drop-shadow(0 0 6px #a6c0ff);
        }
        .board-wrapper {
            display: flex;
            justify-content: center;
            border-radius: 18px;
            background: #1e1e2b;
            padding: 10px;
            box-shadow: inset 0 0 0 2px #3b3b55, 0 10px 20px #0b0b12;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 480px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 0 2px #252532;
            background: #3e3e5a;
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            transition: background 0.08s ease;
            position: relative;
            line-height: 1;
            font-family: 'Segoe UI', 'Arial Unicode MS', 'Noto Sans', sans-serif;
        }
        .square.light {
            background: #e9e2d0;
        }
        .square.dark {
            background: #8f7a66;
        }
        .square.selected {
            background: #f5d36c !important;
            box-shadow: inset 0 0 0 3px #f5b042, inset 0 0 12px #ffd966;
        }
        .square.last-move {
            background: #b9d48b !important;
        }
        .square.check {
            background: #d96f6f !important;
            animation: pulse 0.9s infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: inset 0 0 0 4px #ff4d4d; }
            to { box-shadow: inset 0 0 0 4px #b30000; }
        }
        .piece {
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.4));
            transition: transform 0.1s ease;
            display: inline-block;
        }
        .square:hover .piece {
            transform: scale(1.05);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: #ddd9cf;
            font-weight: 400;
            padding: 0 6px;
        }
        .turn-indicator {
            background: #34344e;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 18px;
            letter-spacing: 0.5px;
            box-shadow: inset 0 1px 4px #101018, 0 4px 6px #0b0b12;
            border: 1px solid #5d5d7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .turn-indicator .piece-icon {
            font-size: 26px;
            filter: drop-shadow(0 2px 2px black);
        }
        button {
            background: #4a4a6a;
            border: none;
            border-radius: 40px;
            padding: 8px 24px;
            font-size: 16px;
            font-weight: 500;
            color: #f0ede5;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e1e2c, 0 8px 12px #0d0d14;
            transition: all 0.06s ease;
            border: 1px solid #6b6b8a;
            letter-spacing: 1px;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #1e1e2c, 0 6px 10px #0d0d14;
        }
        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #7f7d94;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1><span>♜</span> ШАХМАТЫ <span>♞</span></h1>
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        <div class="status-bar">
            <div class="turn-indicator" id="turnIndicator">
                <span class="piece-icon" id="turnIcon">♔</span>
                <span id="turnText">Белые</span>
            </div>
            <button id="resetButton">⟲ Заново</button>
        </div>
        <div class="footer-note">Выберите фигуру и сделайте ход</div>
    </div>
    <script>
        (function() {
            // ---------- СОСТОЯНИЕ ----------
            // Доска: 8x8, где каждый элемент — объект { type, color } или null
            let board = [];
            let turn = 'white';          // 'white' или 'black'
            let selected = null;         // { row, col }
            let lastMove = null;         // { from: {row, col}, to: {row, col} }
            let gameOver = false;

            // ---------- ИНИЦИАЛИЗАЦИЯ ----------
            function initBoard() {
                // Пустая доска
                board = Array(8).fill().map(() => Array(8).fill(null));

                // Чёрные фигуры (верх, строка 0 и 1)
                const backRank = ['rook', 'knight', 'bishop', 'queen', 'king', 'bishop', 'knight', 'rook'];
                for (let col = 0; col < 8; col++) {
                    board[0][col] = { type: backRank[col], color: 'black' };
                    board[1][col] = { type: 'pawn', color: 'black' };
                }
                // Белые фигуры (низ, строки 6 и 7)
                for (let col = 0; col < 8; col++) {
                    board[6][col] = { type: 'pawn', color: 'white' };
                    board[7][col] = { type: backRank[col], color: 'white' };
                }

                turn = 'white';
                selected = null;
                lastMove = null;
                gameOver = false;
            }

            // ---------- ОТРИСОВКА ----------
            const boardEl = document.getElementById('board');
            const turnIcon = document.getElementById('turnIcon');
            const turnText = document.getElementById('turnText');

            // Юникод-символы для фигур
            const pieceSymbols = {
                white: {
                    king: '♔',
                    queen: '♕',
                    rook: '♖',
                    bishop: '♗',
                    knight: '♘',
                    pawn: '♙'
                },
                black: {
                    king: '♚',
                    queen: '♛',
                    rook: '♜',
                    bishop: '♝',
                    knight: '♞',
                    pawn: '♟'
                }
            };

            function render() {
                boardEl.innerHTML = '';

                // Определяем, стоит ли король под шахом (для подсветки)
                let checkSquare = null;
                if (!gameOver) {
                    const kingPos = findKing(turn);
                    if (kingPos && isSquareAttacked(kingPos.row, kingPos.col, turn === 'white' ? 'black' : 'white')) {
                        checkSquare = kingPos;
                    }
                }

                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;

                        // Подсветка выбранной клетки
                        if (selected && selected.row === row && selected.col === col) {
                            square.classList.add('selected');
                        }

                        // Подсветка последнего хода
                        if (lastMove) {
                            if ((lastMove.from.row === row && lastMove.from.col === col) ||
                                (lastMove.to.row === row && lastMove.to.col === col)) {
                                square.classList.add('last-move');
                            }
                        }

                        // Подсветка шаха
                        if (checkSquare && checkSquare.row === row && checkSquare.col === col) {
                            square.classList.add('check');
                        }

                        // Фигура
                        const piece = board[row][col];
                        if (piece) {
                            const span = document.createElement('span');
                            span.className = 'piece';
                            span.textContent = pieceSymbols[piece.color][piece.type];
                            // Дополнительная тень для чёрных фигур, чтобы лучше читались
                            if (piece.color === 'black') {
                                span.style.textShadow = '0 0 2px #aaa, 0 2px 3px black';
                            } else {
                                span.style.textShadow = '0 0 2px #fff, 0 2px 3px rgba(0,0,0,0.5)';
                            }
                            square.appendChild(span);
                        }

                        // Обработчик клика
                        square.addEventListener('click', () => onSquareClick(row, col));

                        boardEl.appendChild(square);
                    }
                }

                // Обновляем индикатор хода
                if (gameOver) {
                    turnIcon.textContent = '🏁';
                    turnText.textContent = 'Игра окончена';
                } else {
                    turnIcon.textContent = turn === 'white' ? '♔' : '♚';
                    turnText.textContent = turn === 'white' ? 'Белые' : 'Чёрные';
                }
            }

            // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
            function findKing(color) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'king' && p.color === color) return { row: r, col: c };
                    }
                }
                return null;
            }

            // Атакована ли клетка (row, col) фигурами цвета attackerColor
            function isSquareAttacked(row, col, attackerColor) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const piece = board[r][c];
                        if (!piece || piece.color !== attackerColor) continue;

                        // Может ли эта фигура атаковать (row, col)?
                        if (canPieceAttack(r, c, row, col, piece)) {
                            return true;
                        }
                    }
                }
                return false;
            }

            // Проверка, атакует ли фигура из (fromRow, fromCol) клетку (toRow, toCol)
            function canPieceAttack(fromRow, fromCol, toRow, toCol, piece) {
                const dr = toRow - fromRow;
                const dc = toCol - fromCol;

                // Нельзя атаковать свою клетку (на всякий случай)
                if (dr === 0 && dc === 0) return false;

                switch (piece.type) {
                    case 'pawn': {
                        const direction = piece.color === 'white' ? -1 : 1;
                        // Атака по диагонали на одну клетку
                        return (dr === direction && Math.abs(dc) === 1);
                    }
                    case 'knight': {
                        const absDr = Math.abs(dr);
                        const absDc = Math.abs(dc);
                        return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
                    }
                    case 'bishop': {
                        if (Math.abs(dr) !== Math.abs(dc)) return false;
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    case 'rook': {
                        if (dr !== 0 && dc !== 0) return false;
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    case 'queen': {
                        if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return false;
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    case 'king': {
                        return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;
                    }
                    default: return false;
                }
            }

            // Проверка, свободен ли путь между клетками (для слона, ладьи, ферзя)
            function isPathClear(fromRow, fromCol, toRow, toCol) {
                const dr = Math.sign(toRow - fromRow);
                const dc = Math.sign(toCol - fromCol);
                let r = fromRow + dr;
                let c = fromCol + dc;

                while (r !== toRow || c !== toCol) {
                    if (board[r][c] !== null) return false;
                    r += dr;
                    c += dc;
                }
                return true;
            }

            // Проверка легальности хода (базовая, без учета шаха/мата)
            function isValidMove(fromRow, fromCol, toRow, toCol) {
                const piece = board[fromRow][fromCol];
                if (!piece) return false;

                const target = board[toRow][toCol];
                // Нельзя бить свою фигуру
                if (target && target.color === piece.color) return false;

                const dr = toRow - fromRow;
                const dc = toCol - fromCol;

                switch (piece.type) {
                    case 'pawn': {
                        const direction = piece.color === 'white' ? -1 : 1;
                        const startRow = piece.color === 'white' ? 6 : 1;

                        // Ход вперёд на одну клетку (если пусто)
                        if (dc === 0 && dr === direction && !target) return true;

                        // Ход на две клетки со стартовой позиции (если пусто и путь свободен)
                        if (dc === 0 && dr === 2 * direction && fromRow === startRow && !target) {
                            const intermediateRow = fromRow + direction;
                            if (board[intermediateRow][fromCol] === null) return true;
                        }

                        // Взятие по диагонали (если там фигура противника)
                        if (Math.abs(dc) === 1 && dr === direction && target && target.color !== piece.color) return true;

                        return false;
                    }
                    case 'knight': {
                        const absDr = Math.abs(dr);
                        const absDc = Math.abs(dc);
                        return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
                    }
                    case 'bishop': {
                        if (Math.abs(dr) !== Math.abs(dc)) return false;
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    case 'rook': {
                        if (dr !== 0 && dc !== 0) return false;
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    case 'queen': {
                        if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return false;
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    case 'king': {
                        return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;
                    }
                    default: return false;
                }
            }

            // Симуляция хода: возвращает копию доски после хода
            function simulateMove(fromRow, fromCol, toRow, toCol) {
                const newBoard = board.map(row => row.map(cell => cell ? { ...cell } : null));
                newBoard[toRow][toCol] = newBoard[fromRow][fromCol];
                newBoard[fromRow][fromCol] = null;
                return newBoard;
            }

            // Проверка, остаётся ли король цвета color в безопасности после хода
            function kingSafeAfterMove(fromRow, fromCol, toRow, toCol, color) {
                const originalBoard = board;
                // Симулируем ход
                board = simulateMove(fromRow, fromCol, toRow, toCol);

                const kingPos = findKing(color);
                let safe = true;
                if (kingPos) {
                    const enemyColor = color === 'white' ? 'black' : 'white';
                    safe = !isSquareAttacked(kingPos.row, kingPos.col, enemyColor);
                }

                // Восстанавливаем доску
                board = originalBoard;
                return safe;
            }

            // Проверка, есть ли у игрока цвета color хотя бы один легальный ход
            function hasAnyLegalMove(color) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const piece = board[r][c];
                        if (!piece || piece.color !== color) continue;

                        for (let tr = 0; tr < 8; tr++) {
                            for (let tc = 0; tc < 8; tc++) {
                                if (isValidMove(r, c, tr, tc)) {
                                    if (kingSafeAfterMove(r, c, tr, tc, color)) {
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                }
                return false;
            }

            // Проверка на мат/пат для текущего игрока
            function checkGameOver() {
                const currentColor = turn;
                const kingPos = findKing(currentColor);
                const enemyColor = currentColor === 'white' ? 'black' : 'white';

                const inCheck = kingPos && isSquareAttacked(kingPos.row, kingPos.col, enemyColor);
                const hasMoves = hasAnyLegalMove(currentColor);

                if (!hasMoves) {
                    gameOver = true;
                    if (inCheck) {
                        // Мат
                        turnText.textContent = currentColor === 'white' ? 'Мат! Чёрные победили' : 'Мат! Белые победили';
                    } else {
                        // Пат
                        turnText.textContent = 'Пат! Ничья';
                    }
                    turnIcon.textContent = '🏁';
                    return true;
                }
                return false;
            }

            // ---------- ОБРАБОТКА КЛИКОВ ----------
            function onSquareClick(row, col) {
                if (gameOver) return;

                const clickedPiece = board[row][col];

                // Если выбрана фигура и кликнули на возможную цель
                if (selected) {
                    const fromRow = selected.row;
                    const fromCol = selected.col;
                    const piece = board[fromRow][fromCol];

                    // Ход на другую клетку
                    if (fromRow !== row || fromCol !== col) {
                        // Проверяем валидность хода и безопасность короля
                        if (isValidMove(fromRow, fromCol, row, col) &&
                            kingSafeAfterMove(fromRow, fromCol, row, col, piece.color)) {

                            // Выполняем ход
                            board[row][col] = piece;
                            board[fromRow][fromCol] = null;

                            // Сохраняем последний ход для подсветки
                            lastMove = {
                                from: { row: fromRow, col: fromCol },
                                to: { row, col }
                            };

                            // Смена хода
                            turn = turn === 'white' ? 'black' : 'white';
                            selected = null;

                            // Проверка на завершение игры
                            checkGameOver();
                            render();
                            return;
                        }
                    }
                }

                // Иначе — выбираем фигуру (если она принадлежит текущему игроку)
                if (clickedPiece && clickedPiece.color === turn) {
                    selected = { row, col };
                } else {
                    selected = null; // клик по пустой клетке или чужой фигуре снимает выделение
                }
                render();
            }

            // ---------- СБРОС ----------
            function resetGame() {
                initBoard();
                selected = null;
                lastMove = null;
                gameOver = false;
                render();
            }

            // ---------- СТАРТ ----------
            initBoard();
            render();

            document.getElementById('resetButton').addEventListener('click', resetGame);
        })();
    </script>
</body>
</html>
